<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Territorium Keizerstad</title>
  <link rel="icon" href="/images/logo.png">
  <link rel="apple-touch-icon" href="/images/logo.png">
  <style>
    :root {
      --red: #D62828;
      --green: #1E7B34;
      --black: #111111;
      --white: #ffffff;
      --bg: #000000;
      --muted: #a8a8a8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--white);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      position: relative;
    }
    .lang-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      gap: 6px;
    }
    .lang-btn {
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      opacity: 0.45;
      transition: opacity .2s ease;
      line-height: 0;
    }
    .lang-btn:hover,
    .lang-btn.active { opacity: 1; }
    .lang-btn img {
      width: 22px;
      height: 16px;
      object-fit: cover;
      border-radius: 2px;
      display: block;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--white);
      margin-bottom: 8px;
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    h1 { font-size: clamp(26px, 6vw, 36px); font-weight: 800; letter-spacing: -0.02em; }
    p { color: var(--muted); font-size: 17px; max-width: 30ch; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
      background: var(--red);
      color: var(--white);
      text-decoration: none;
      font-weight: 600;
      padding: 14px 22px;
      border-radius: 14px;
      min-height: 48px;
      border-bottom: 4px solid var(--green);
    }
    .btn:hover { background: var(--green); }
  </style>
</head>
<body>

  <div class="lang-toggle" role="group" aria-label="Taal">
    <button type="button" class="lang-btn" data-lang="nij" title="Nijmeegs"><img src="/images/flag-nij.png" alt="Nijmeegs"></button>
    <button type="button" class="lang-btn" data-lang="nl" title="Nederlands"><img src="/images/flag-nl.png" alt="Nederlands"></button>
  </div>

  <div class="logo"><img src="/images/logo.png" alt="Territorium Keizerstad logo"></div>
  <h1 data-i18n="title">Wa zoekt gij nou?</h1>
  <p data-i18n="text">Die pagina bestaot nie.</p>
  <a class="btn" href="/" data-i18n="back">Terug naar huus</a>

  <script>
    const T = {
      nij: {
        title: 'Wa zoekt gij nou?',
        text: 'Die pagina bestaot nie.',
        back: 'Terug naar huus'
      },
      nl: {
        title: 'Waar zoek je naar?',
        text: 'Die pagina bestaat niet.',
        back: 'Terug naar de homepagina'
      }
    };

    function applyLang(lang) {
      try { localStorage.setItem('taal', lang); } catch (e) {}
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        el.textContent = T[lang][key];
        el.title = lang === 'nij' ? T.nl[key] : '';
      });
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    }

    document.querySelectorAll('.lang-btn').forEach(b =>
      b.addEventListener('click', () => applyLang(b.dataset.lang))
    );

    applyLang(localStorage.getItem('taal') || 'nij');
  </script>
</body>
</html>
