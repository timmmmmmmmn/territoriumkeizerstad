<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Stickers van Territorium Keizerstad uit Nijmegen.">
  <meta name="theme-color" content="#111111">
  <title>Territorium Keizerstad</title>
  <style>
    :root {
      --red: #D62828;
      --green: #1E7B34;
      --black: #111111;
      --white: #ffffff;
      --bg: #000000;
      --muted: #5c5c5c;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--white);
      line-height: 1.5;
      min-height: 100dvh;
      padding-bottom: calc(130px + var(--safe-bottom));
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Achtergrond (vast, scrollt niet mee) ---------- */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-color: var(--bg);
      background-image: url('images/achtergrond.png');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: 50% 30%;   /* telefoon */
    }
    @media (min-width: 900px) {
      .bg-layer { background-position: 50% 50%; }  /* laptop en desktop */
    }

    /* ---------- Header ---------- */
    .top {
      background: var(--bg);
      border-bottom: 3px solid var(--red);
      padding: calc(12px + var(--safe-top)) 20px 12px;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
    }
    .logo {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--red);
      border: 3px solid var(--white);
      box-shadow: 0 2px 10px rgba(0,0,0,.35);
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ---------- Views ---------- */
    .view { display: none; max-width: 760px; margin: 0 auto; }
    .view.active { display: block; animation: fade .25s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .view-inner { padding: 20px 16px 32px; }

    /* ---------- Slideshow ---------- */
    .slideshow {
      position: relative;
      width: 100%;
      aspect-ratio: 5120 / 2160;
      background: var(--black);
      overflow: hidden;
    }
    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .8s ease;
    }
    .slide.active { opacity: 1; }
    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* vult het vlak als de foto een andere verhouding heeft */
      display: block;
    }

    /* ---------- Products ---------- */
    .section-title {
      font-size: 22px;
      letter-spacing: -0.01em;
      margin: 0 2px 14px;
    }
    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 560px) { .grid { grid-template-columns: 1fr 1fr; } }

    .card {
      background: var(--white);
      border-radius: 20px;
      border-top: 6px solid var(--green);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 1px 2px rgba(0,0,0,.05);
    }
    .card .img {
      aspect-ratio: 1 / 1;
      background: #fbfbfb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .card .img { position: relative; }
    .card .img img {
      position: absolute;
      top: 18px;
      left: 18px;
      width: calc(100% - 36px);
      height: calc(100% - 36px);
      object-fit: contain; /* hele foto zichtbaar, nooit afgesneden */
    }
    .card .info {
      padding: 16px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .card h4 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
    .card p { color: var(--muted); font-size: 14px; flex: 1; }
    .card .btn { margin-top: 10px; width: 100%; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--red);
      color: var(--white);
      text-decoration: none;
      font: inherit;
      font-weight: 600;
      padding: 14px 22px;
      border-radius: 14px;
      border: 0;
      cursor: pointer;
      min-height: 48px;
      transition: transform .15s ease, background .2s ease;
    }
    .btn:hover { background: var(--green); }
    .btn:active { transform: scale(.97); }

    /* ---------- Uitgelicht ---------- */
    .featured {
      background: var(--white);
      color: var(--black);
      border-radius: 22px;
      overflow: hidden;
      border-top: 6px solid var(--red);
      border-bottom: 6px solid var(--green);
      display: grid;
      grid-template-columns: 1fr;
    }
    @media (min-width: 560px) { .featured { grid-template-columns: 1fr 1fr; } }
    .featured-img {
      background: #fbfbfb;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .featured-img { position: relative; }
    .featured-img img {
      position: absolute;
      top: 24px;
      left: 24px;
      width: calc(100% - 48px);
      height: calc(100% - 48px);
      object-fit: contain; /* hele foto zichtbaar, nooit afgesneden */
    }
    .featured-info {
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 16px;
    }
    .featured-info h3 { font-size: 28px; font-weight: 800; line-height: 1.1; letter-spacing: -0.01em; }
    .price-note { color: var(--white); font-weight: 700; margin-top: 16px; }
    .insta-strip { margin-top: 16px; }

    /* ---------- Reviews ---------- */
    .reviews { display: grid; gap: 14px; }
    .review {
      background: var(--white);
      color: var(--black);
      border-radius: 20px;
      padding: 20px;
      border-left: 6px solid var(--red);
    }
    .stars { color: var(--red); font-size: 18px; letter-spacing: 2px; margin-bottom: 8px; }
    .review-text { font-size: 16px; margin-bottom: 10px; }
    .review-name { font-size: 13px; font-weight: 700; color: var(--green); }
    .no-reviews { color: #a8a8a8; }
    .review-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .review-head .stars { margin-bottom: 0; }
    .review-head .review-name { display: block; font-size: 15px; color: var(--black); }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--green);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      flex-shrink: 0;
    }
    .review:nth-child(even) .avatar { background: var(--red); }
    .review-featured {
      border-left: 0;
      border-top: 6px solid var(--red);
      border-bottom: 6px solid var(--green);
      padding: 28px 24px;
    }
    .review-featured .stars { font-size: 20px; margin-bottom: 10px; }
    .review-featured .review-text { font-size: 20px; font-weight: 600; margin-bottom: 14px; }
    .review-featured .review-name { display: block; color: var(--black); font-weight: 700; }
    .reviews-featured { margin-bottom: 20px; }
    .home-review { margin-top: 16px; }
    .review { text-align: center; }
    .review-name { display: block; font-size: 14px; font-weight: 400; color: var(--muted); margin-bottom: 6px; }
    .review-text { font-size: 20px; font-weight: 800; color: var(--black); }
    .review-featured .review-name { font-size: 15px; }
    .review-featured .review-text { font-size: 26px; font-weight: 800; }
    .support-mail { margin-top: 24px; color: #a8a8a8; font-size: 14px; }
    .support-mail a, .credits a { color: var(--green); font-weight: 700; text-decoration: none; }
    .support-mail a:hover, .credits a:hover { text-decoration: underline; }

    /* ---------- Glassy kaarten (reviews + bestel-kaarten) ---------- */
    .card,
    .featured,
    .review {
      background: var(--white);
      border: 0;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      color: var(--black);
    }
    .card .img { background: #fbfbfb; }
    .featured-img { background: #fbfbfb; }
    .card p { color: var(--muted); }
    .review-text { color: var(--black); }
    .review-name { color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
    .ig { width: 14px; height: 14px; flex-shrink: 0; }

    /* ---------- Alle kaarten: rode rand links, groene rand rechts ---------- */
    .card,
    .featured,
    .review,
    .review-featured {
      background: var(--white);
      border-top: 0;
      border-bottom: 0;
      border-left: 5px solid var(--red);
      border-right: 5px solid var(--green);
    }

    /* ---------- Footer ---------- */
    .site-footer { max-width: 760px; margin: 0 auto; }
    .site-footer img { display: block; width: 100%; height: auto; }
    .credits {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 20px;
      font-size: 12px;
      color: #a8a8a8;
      background: var(--bg);
      border-top: 3px solid var(--red);
    }

    /* ---------- Support ---------- */
    .panel {
      background: var(--white);
      border-radius: 22px;
      padding: 24px 20px;
    }
    .panel h2 { font-size: 24px; letter-spacing: -0.02em; margin-bottom: 8px; }
    .panel p { color: var(--muted); margin-bottom: 18px; }
    .insta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px 18px;
      border-radius: 16px;
      background: var(--black);
      color: var(--white);
      text-decoration: none;
      font-weight: 600;
    }
    .insta .handle { color: var(--green); font-weight: 700; }
    .insta { border-left: 6px solid var(--red); }
    .insta:hover { background: #1a1a1a; border-left-color: var(--green); }

    /* ---------- Floating dock (iOS 26 style) ---------- */
    .dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(14px + var(--safe-bottom));
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      z-index: 50;
      pointer-events: none;
    }
    .glass {
      pointer-events: auto;
      background: rgba(22, 22, 22, 0.6);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 12px 32px rgba(0, 0, 0, 0.5),
        0 2px 6px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .tabbar { display: flex; gap: 2px; padding: 6px; border-radius: 999px; }
    .tab {
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--white);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 66px;
      padding: 9px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: background .25s ease, color .25s ease;
    }
    .tab svg { width: 22px; height: 22px; }
    .tab.active { background: var(--red); color: var(--white); box-shadow: 0 4px 12px rgba(214,40,40,.35); }
    .search-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--white);
      flex-shrink: 0;
    }
    .search-btn svg { width: 22px; height: 22px; }

    /* ---------- Search sheet ---------- */
    .search-sheet {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 60;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: calc(16px + var(--safe-top)) 16px 16px;
    }
    .search-sheet.open { display: flex; animation: fade .2s ease; }
    .search-panel {
      width: 100%;
      max-width: 620px;
      background: var(--bg);
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
    }
    .search-row { display: flex; gap: 10px; align-items: center; }
    .search-row input {
      flex: 1;
      font: inherit;
      font-size: 16px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 2px solid transparent;
      background: var(--white);
      color: var(--black);
      outline: none;
    }
    .search-row input:focus { border-color: var(--green); }
    .close-btn {
      border: 0;
      background: var(--red);
      color: var(--white);
      font: inherit;
      font-weight: 600;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
    }
    .results { margin-top: 12px; display: grid; gap: 8px; max-height: 60vh; overflow-y: auto; }
    .result {
      background: var(--white);
      border-radius: 14px;
      padding: 12px 14px;
      text-decoration: none;
      color: var(--black);
      display: flex;
      flex-direction: column;
    }
    .result strong { font-size: 15px; }
    .result span { font-size: 13px; color: var(--muted); }
    .no-results { color: #a8a8a8; padding: 12px 4px; font-size: 14px; }

    :focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }

    @media (max-width: 380px) {
      .tab { min-width: 58px; padding: 9px 6px; font-size: 11px; }
      .search-btn { width: 52px; height: 52px; }
    }
  </style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>

  <header class="top">
    <div class="logo">
      <img src="images/logo.png" alt="Territorium Keizerstad logo">
    </div>
  </header>

  <!-- HOME: slideshow + producten -->
  <main class="view" id="home">
    <div class="slideshow" id="slideshow" aria-label="Banner"></div>
    <div class="view-inner">
      <h2 class="section-title">Uitgelicht</h2>
      <div id="featured"></div>

      <p class="price-note">Kosten kunnen veranderen dus ziet u pas in het bestel nu menu</p>

      <div id="home-review" class="home-review"></div>

      <a class="insta insta-strip" href="https://www.instagram.com/territoriumkeizerstad/" target="_blank" rel="noopener">
        <span>Volg ons op Instagram</span>
        <span class="handle">@territoriumkeizerstad</span>
      </a>
    </div>
  </main>

  <!-- PRODUCTEN -->
  <main class="view" id="producten">
    <div class="view-inner">
      <h2 class="section-title">Alle producten</h2>
      <div class="grid" data-products></div>
    </div>
  </main>

  <!-- REVIEWS -->
  <main class="view" id="reviews">
    <div class="view-inner">
      <h2 class="section-title">Reviews</h2>
      <div id="reviews-featured" class="reviews-featured"></div>
      <div class="reviews" data-reviews></div>
      <p class="support-mail">Vragen? Mail ons op <a href="mailto:support@territoriumkeizerstad.nl">support@territoriumkeizerstad.nl</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <img src="images/footer.png" alt="Territorium Keizerstad footer" loading="lazy">
    <div class="credits">
      <span>&copy; Territorium Keizerstad 2026</span>
      <a href="mailto:support@territoriumkeizerstad.nl">support@territoriumkeizerstad.nl</a>
    </div>
  </footer>

  <!-- Floating dock -->
  <nav class="dock" aria-label="Hoofdnavigatie">
    <div class="glass tabbar">
      <a class="tab" href="#home" data-view="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
        Home
      </a>
      <a class="tab" href="#producten" data-view="producten">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
        Producten
      </a>
      <a class="tab" href="#reviews" data-view="reviews">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.2 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>
        Reviews
      </a>
      <a class="tab" href="https://www.instagram.com/territoriumkeizerstad/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/></svg>
        Instagram
      </a>
    </div>
    <button class="glass search-btn" id="openSearch" aria-label="Zoeken">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
  </nav>

  <!-- Zoeken -->
  <div class="search-sheet" id="searchSheet" role="dialog" aria-modal="true" aria-label="Zoeken">
    <div class="search-panel">
      <div class="search-row">
        <input type="search" id="q" placeholder="Zoek een sticker…" autocomplete="off" aria-label="Zoek een sticker">
        <button class="close-btn" id="closeSearch">Sluit</button>
      </div>
      <div class="results" id="results"></div>
    </div>
  </div>

  <script>
    const FORM_URL = 'https://forms.gle/ikGYiuPSDgT3w9gy9';

    // Banner: alleen deze afbeelding (bij voorkeur 5120 x 2160)
    const SLIDES = [
      'images/banner.jpg'
    ];

    const SLIDE_INTERVAL_MS = 30000; // elke 30 seconden een nieuwe foto

    const PRODUCTS = [
      {
        id: 'europa-tour-sticker',
        naam: 'Europa Tour Sticker',
        img: 'images/europa-tour-sticker.png'
      }
    ];

    const VIEWS = ['home', 'producten', 'reviews'];

    // ----- Routing via hash -----
    function showView() {
      const hash = (location.hash || '#home').slice(1);
      const view = VIEWS.includes(hash) ? hash : 'home';
      document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === view));
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
      window.scrollTo({ top: 0, behavior: 'auto' });
    }
    window.addEventListener('hashchange', showView);

    // ----- Producten renderen -----
    function renderProducts() {
      const html = PRODUCTS.map(p => `
        <article class="card">
          <div class="img"><img src="${p.img}" alt="${p.naam}" loading="lazy"></div>
          <div class="info">
            <h4>${p.naam}</h4>
            <a class="btn" href="${FORM_URL}" target="_blank" rel="noopener">Bestel nu</a>
          </div>
        </article>`).join('');
      document.querySelectorAll('[data-products]').forEach(el => el.innerHTML = html);
    }

    // ----- Uitgelichte sticker (home) -----
    function renderFeatured() {
      const p = PRODUCTS[0];
      const el = document.getElementById('featured');
      if (!p || !el) return;
      el.innerHTML = `
        <article class="featured">
          <div class="featured-img"><img src="${p.img}" alt="${p.naam}" loading="lazy"></div>
          <div class="featured-info">
            <h3>${p.naam}</h3>
            <a class="btn" href="${FORM_URL}" target="_blank" rel="noopener">Bestel nu</a>
          </div>
        </article>`;
    }

    // ----- Slideshow -----
    // Elke bezoek: willekeurige volgorde en random startfoto.
    // Daarna wisselt hij elke 30 seconden door naar de volgende foto in die volgorde.
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function initSlideshow() {
      const root = document.getElementById('slideshow');
      if (!SLIDES.length) { root.style.display = 'none'; return; }

      const order = shuffle(SLIDES);
      root.innerHTML = order.map((src, i) =>
        `<div class="slide${i === 0 ? ' active' : ''}"><img src="${src}" alt=""${i === 0 ? '' : ' loading="lazy"'}></div>`
      ).join('');

      if (order.length < 2) return;

      const slides = root.querySelectorAll('.slide');
      let current = 0;

      setInterval(() => {
        slides[current].classList.remove('active');
        current = (current + 1) % slides.length;
        slides[current].classList.add('active');
      }, SLIDE_INTERVAL_MS);
    }

    // ----- Zoeken -----
    const sheet = document.getElementById('searchSheet');
    const input = document.getElementById('q');
    const results = document.getElementById('results');

    function renderResults(term) {
      const t = term.trim().toLowerCase();
      if (!t) { results.innerHTML = ''; return; }
      const found = PRODUCTS.filter(p => p.naam.toLowerCase().includes(t));
      results.innerHTML = found.length
        ? found.map(p => `
            <a class="result" href="#producten" data-close="1">
              <strong>${p.naam}</strong>
            </a>`).join('')
        : '<div class="no-results">Geen resultaten gevonden.</div>';
    }

    function openSearch() {
      sheet.classList.add('open');
      setTimeout(() => input.focus(), 50);
    }
    function closeSearch() {
      sheet.classList.remove('open');
      input.value = '';
      results.innerHTML = '';
      input.blur();
    }

    document.getElementById('openSearch').addEventListener('click', openSearch);
    document.getElementById('closeSearch').addEventListener('click', closeSearch);
    input.addEventListener('input', e => renderResults(e.target.value));
    results.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSearch(); });
    sheet.addEventListener('click', e => { if (e.target === sheet) closeSearch(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSearch(); });

    // ----- Reviews -----
    // Voeg reviews toe als: { naam: 'Naam', sterren: 5, tekst: 'Review tekst' }
    const REVIEWS = [
      { naam: 'noah0.880', sterren: 5, tekst: 'Mooi design' },
      { naam: 'lucazwartjes', sterren: 5, tekst: 'Mooie stickers!' },
      { naam: 'nout._024', sterren: 5, tekst: 'Mooie stickers met snelle verzending!!' },
      { naam: 'guus_024', sterren: 5, tekst: 'Goede stickers!' },
      { naam: 'ricco080', sterren: 5, tekst: 'Top kwaliteit en goede levering' },
      { naam: 'vgnmgn024', sterren: 5, tekst: 'Stickers zijn echt top kwaliteit! 🙌' }
    ];

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    const IG_ICON = '<svg class="ig" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor"/></svg>';

    function reviewCard(r) {
      return `
        <article class="review">
          <p class="review-text">“${r.tekst}”</p>
          <span class="review-name">${IG_ICON}${r.naam}</span>
        </article>`;
    }

    function featuredReviewCard(r) {
      return `
        <article class="review review-featured">
          <p class="review-text">“${r.tekst}”</p>
          <span class="review-name">${IG_ICON}${r.naam}</span>
        </article>`;
    }

    function renderReviews() {
      const listEl = document.querySelector('[data-reviews]');
      if (!REVIEWS.length) {
        if (listEl) listEl.innerHTML = '<p class="no-reviews">Reviews komen er binnenkort aan.</p>';
        return;
      }

      // Reviewpagina: één willekeurige uitgelichte bovenaan, daarna alle reviews onder elkaar
      const featEl = document.getElementById('reviews-featured');
      if (featEl) featEl.innerHTML = featuredReviewCard(pickRandom(REVIEWS));
      if (listEl) listEl.innerHTML = REVIEWS.map(reviewCard).join('');

      // Homepagina: één willekeurige uitgelichte review
      const homeEl = document.getElementById('home-review');
      if (homeEl) homeEl.innerHTML = featuredReviewCard(pickRandom(REVIEWS));
    }

    // ----- Init -----
    renderProducts();
    renderFeatured();
    renderReviews();
    initSlideshow();
    showView();
  </script>
</body>
</html>
